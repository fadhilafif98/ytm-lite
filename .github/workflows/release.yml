name: Release Extension Zip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches manifest.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "v$VER" ]; then
            echo "Tag ($TAG) does not match manifest.json version (v$VER)"
            exit 1
          fi

      - name: Run checks and unit tests
        run: |
          for f in content.js inject.js popup.js theme-init.js src/*.js tests/*.js; do
            node --check "$f"
          done
          node --test tests/*.test.js

      - name: Package extension zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="dist/ytm-lite"
          mkdir -p "$STAGE/icons"
          cp manifest.json content.js content.css inject.js popup.html popup.css popup.js theme-init.js "$STAGE/"
          cp -r src "$STAGE/"
          cp icons/icon-*.png "$STAGE/icons/"
          if [ -f LICENSE ]; then cp LICENSE "$STAGE/"; fi
          (cd dist && zip -r "../ytm-lite-${TAG}.zip" ytm-lite)
          unzip -l "ytm-lite-${TAG}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ytm-lite-${{ github.ref_name }}.zip
